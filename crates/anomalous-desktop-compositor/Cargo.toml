[package]
name = "anomalous-desktop-compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Allocation-free row compositor for the canonical Anomalous desktop workspace"
publish = false

[features]
native_editor_bridge = ["anomalous-desktop-workspace/native_editor_bridge"]
native_editor_remote = ["native_editor_bridge", "anomalous-desktop-workspace/native_editor_remote"]

[lib]
path = "src/lib.rs"

[dependencies]
anomalous-window-surface.workspace = true
anomalous-desktop-workspace = { path = "../anomalous-desktop-workspace" }
anomalous-desktop-theme = { path = "../anomalous-desktop-theme" }

[dev-dependencies]
anomalous-editor-contract = { path = "../anomalous-editor-contract" }
anomalous-document-protocol.workspace = true
