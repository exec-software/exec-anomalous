[package]
name = "anomalous-desktop-renderer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Allocation-free bounded semantic desktop renderer proof for Anomalous"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
scene_conformance = ["dep:anomalous-desktop-scene"]
transport = ["dep:anomalous-desktop-transport"]

[dependencies]
anomalous-desktop-scene = { path = "../anomalous-desktop-scene", optional = true }
anomalous-desktop-transport = { path = "../anomalous-desktop-transport", optional = true }

[dev-dependencies]
anomalous-desktop-scene = { path = "../anomalous-desktop-scene" }
