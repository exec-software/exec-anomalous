[package]
name = "anomalous-program-executor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Experimental bounded host qualification core for admitted NIL"
publish = false

[features]
host_conformance = ["anomalous-program-flow/host_conformance"]

[[example]]
name = "program_conformance_probe"
required-features = ["host_conformance"]

[[example]]
name = "program_text_conformance_probe"
required-features = ["host_conformance"]

[[example]]
name = "program_array_conformance_probe"
required-features = ["host_conformance"]

[[example]]
name = "program_callable_conformance_probe"
required-features = ["host_conformance"]

[[example]]
name = "program_record_conformance_probe"
required-features = ["host_conformance"]

[[example]]
name = "program_global_conformance_probe"
required-features = ["host_conformance"]

[[example]]
name = "program_enum_conformance_probe"
required-features = ["host_conformance"]

[dependencies]
anomalous-program-manifest = { workspace = true, features = ["execution_view"] }
anomalous-native-runtime.workspace = true
anomalous-program-flow.workspace = true
