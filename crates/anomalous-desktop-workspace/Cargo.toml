[package]
name = "anomalous-desktop-workspace"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
native_editor_bridge = []
native_editor_remote = ["native_editor_bridge", "anomalous-editor-contract/remote_editor"]

[dependencies]
anomalous-editor-contract = { path = "../anomalous-editor-contract" }
anomalous-window-surface.workspace = true
anomalous-desktop-theme = { path = "../anomalous-desktop-theme" }
