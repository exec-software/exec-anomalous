[package]
name = "anomalous-supervised-renderer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Fixed-address supervised ring-3 renderer proof for Anomalous"
publish = false
build = "build.rs"

[[bin]]
name = "anomalous-supervised-renderer"
path = "src/main.rs"
test = false
bench = false

[dependencies]
anomalous-abi.workspace = true
anomalous-desktop-renderer = { path = "../../crates/anomalous-desktop-renderer", default-features = false }

[build-dependencies]
anomalous-desktop-renderer = { path = "../../crates/anomalous-desktop-renderer", features = ["scene_conformance"] }
