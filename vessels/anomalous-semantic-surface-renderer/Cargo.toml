[package]
name = "anomalous-semantic-surface-renderer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Transport-backed ring-3 semantic-surface renderer proof for Anomalous"
publish = false
build = "build.rs"

[[bin]]
name = "anomalous-semantic-surface-renderer"
path = "src/main.rs"
test = false
bench = false

[dependencies]
anomalous-abi.workspace = true
anomalous-desktop-renderer = { path = "../../crates/anomalous-desktop-renderer", features = ["transport"] }
anomalous-desktop-transport.workspace = true
