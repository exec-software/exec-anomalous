[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anomalous-document-protocol.workspace = true
anomalous-native-runtime.workspace = true
anomalous-program-manifest.workspace = true
anomalous-elf-adapter = { workspace = true, features = ["linux_image"] }
anomalous-abi.workspace = true
anomalous-veil-protocol = { workspace = true, features = ["read-only-files"] }
anomalous-editor-contract = { path = "../../crates/anomalous-editor-contract" }
anomalous-window-surface.workspace = true
anomalous-desktop-workspace = { path = "../../crates/anomalous-desktop-workspace", features = ["native_editor_remote"] }
anomalous-desktop-compositor = { path = "../../crates/anomalous-desktop-compositor", features = ["native_editor_remote"] }
anomalous-desktop-transport = { path = "../../crates/anomalous-desktop-transport", features = ["service_adapter"] }

[dev-dependencies]
anomalous-desktop-renderer = { path = "../../crates/anomalous-desktop-renderer", default-features = false, features = ["scene_conformance"] }
